[project]
name = "cozmo"
version = "0.1.0"
description = "Handheld capture to dimensioned floor plan: output contract, CLI, and evaluation harness"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "shapely>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "pillow-heif>=1.7.0",
]

[project.scripts]
cozmo = "cozmo.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cozmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
