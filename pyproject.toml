[project]
name = "cozmo"
version = "0.1.0"
description = "Handheld capture to dimensioned floor plan: output contract, CLI, and evaluation harness"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "shapely>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "pillow-heif>=1.7.0",
]

[project.optional-dependencies]
# The lidar tier needs none of these. It is classical geometry, so nothing in a
# lidar dimension came from a trained model. Install what you actually intend
# to run; see the two install profiles in README.md.

# Damage detection: OWLv2 for detection, SigLIP to verify the crops.
damage = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]

# Video and photo tiers: COLMAP for structure from motion, Depth Pro and Depth
# Anything for monocular depth, MapAnything for poses across a chunk boundary,
# imageio-ffmpeg for decoding, pillow-heif for iPhone stills.
video = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pycolmap>=3.10",
    "transformers>=4.40",
    "depth-pro @ git+https://github.com/apple/ml-depth-pro.git",
    "mapanything @ git+https://github.com/facebookresearch/map-anything.git",
    "imageio-ffmpeg>=0.5",
    "pillow-heif>=1.7.0",
    "gdown>=5.0",
]
photo = ["cozmo[video]"]

all = ["cozmo[damage]", "cozmo[video]"]

[project.scripts]
cozmo = "cozmo.cli:app"

[dependency-groups]
# gdown is here because scripts/fetch_sample_data.sh is part of the
# documented first run, and a stranger should not have to install a tool
# by hand before the README works.
dev = [
    "pytest>=8.0",
    "gdown>=5.0",      # scripts/fetch_sample_data.sh
    "reportlab>=4.0",  # scripts/md_to_pdf.py, the no-pandoc report renderer
    "pypdf>=4.0",      # page-count check in scripts/build_report.sh
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cozmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
