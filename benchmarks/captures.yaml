# Benchmark registry read by `cozmo bench`. Paths are relative to the repo root.
# repeat_of marks a second capture of the same physical space at the same tier;
# such pairs feed the repeatability gate and the ceiling-height spread check.
captures:
  - capture_id: EXAMPLE
    space_id: example_flat
    tier: photo
    input: benchmarks/captures/EXAMPLE
    ground_truth: benchmarks/ground_truth/EXAMPLE.yaml
    repeat_of: null
    multi_room: true
    # Synthetic fixture: the files are placeholders, not photographs.
    pipeline: stub
  - capture_id: EXAMPLE_REPEAT
    space_id: example_flat
    tier: photo
    input: benchmarks/captures/EXAMPLE_REPEAT
    ground_truth: benchmarks/ground_truth/EXAMPLE_REPEAT.yaml
    repeat_of: EXAMPLE
    multi_room: true
    pipeline: stub
  # iPhone LiDAR sample scans in Stray Scanner format. No tape ground truth
  # exists for these yet, so bench reports outputs, runtime and
  # self-consistency only. The two apartment scans are a repeat pair.
  # c00a170fe1 is not one closed room: the path crosses two or three partly
  # scanned spaces with unobserved sides. No scan has a ground-truth room count.
  - capture_id: c00a170fe1
    space_id: sample_partial_spaces
    tier: lidar
    input: data/sample/c00a170fe1
    ground_truth: null
    device: "iPhone with LiDAR, supplied scan; no EXIF available"
    repeat_of: null
    multi_room: false
  - capture_id: 1a8384c3f6
    space_id: sample_apartment
    tier: lidar
    input: data/sample/1a8384c3f6
    ground_truth: null
    device: "iPhone with LiDAR, supplied scan; no EXIF available"
    repeat_of: null
    multi_room: true
  - capture_id: c7d28f72c6
    space_id: sample_apartment
    tier: lidar
    input: data/sample/c7d28f72c6
    ground_truth: null
    device: "iPhone with LiDAR, supplied scan; no EXIF available"
    repeat_of: 1a8384c3f6
    # Not a valid repeat: the two scans cover different subsets of the flat,
    # so their disagreement measures coverage, not repeatability. Reported as
    # a coverage-mismatched pair with a secondary statistic, never as the gate.
    repeat_kind: coverage_mismatched
    multi_room: true

  # Hand-measured captures. Every room was shot as photos and as one video
  # loop; the photo tier reads the room folder, the video tier reads the same
  # folder's clip. "home" is the whole property as one multi-room capture.

  - capture_id: own_hall_photo
    space_id: own_hall
    tier: photo
    input: data/own/hall
    ground_truth: benchmarks/ground_truth/own_hall_photo.yaml
    device: "Moto Edge 50 Neo, Android"
    repeat_of: null
    multi_room: false
  - capture_id: own_bedroom_1_photo
    space_id: own_bedroom_1
    tier: photo
    input: data/own/bedroom_1
    ground_truth: benchmarks/ground_truth/own_bedroom_1_photo.yaml
    device: "Moto Edge 50 Neo, Android"
    repeat_of: null
    multi_room: false
  - capture_id: own_bedroom_2_photo
    space_id: own_bedroom_2
    tier: photo
    input: data/own/bedroom_2
    ground_truth: benchmarks/ground_truth/own_bedroom_2_photo.yaml
    device: "Moto Edge 50 Neo, Android"
    repeat_of: null
    multi_room: false
  - capture_id: own_bedroom_2_repeat_photo
    space_id: own_bedroom_2
    tier: photo
    input: data/own/bedroom_2_repeat
    ground_truth: benchmarks/ground_truth/own_bedroom_2_repeat_photo.yaml
    device: "Nokia 8.1, Android"
    repeat_kind: cross_device_repeat
    repeat_of: own_bedroom_2_photo
    multi_room: false
  - capture_id: own_kitchen_photo
    space_id: own_kitchen
    tier: photo
    input: data/own/kitchen
    ground_truth: benchmarks/ground_truth/own_kitchen_photo.yaml
    device: "Moto Edge 50 Neo, Android"
    repeat_of: null
    multi_room: false
  - capture_id: own_home_photo
    space_id: own_home
    tier: photo
    input: data/own/home
    ground_truth: benchmarks/ground_truth/own_home_photo.yaml
    device: "Moto Edge 50 Neo, Android (all four rooms)"
    repeat_of: null
    multi_room: true
  - capture_id: own_hall_video
    space_id: own_hall
    tier: video
    input: data/own/hall
    ground_truth: benchmarks/ground_truth/own_hall_video.yaml
    device: "Nokia 8.1, Android"
    repeat_of: null
    multi_room: false
  - capture_id: own_bedroom_1_video
    space_id: own_bedroom_1
    tier: video
    input: data/own/bedroom_1
    ground_truth: benchmarks/ground_truth/own_bedroom_1_video.yaml
    device: "Nokia 8.1, Android"
    repeat_of: null
    multi_room: false
  - capture_id: own_bedroom_2_video
    space_id: own_bedroom_2
    tier: video
    input: data/own/bedroom_2
    ground_truth: benchmarks/ground_truth/own_bedroom_2_video.yaml
    device: "Nokia 8.1, Android"
    repeat_of: null
    multi_room: false
  - capture_id: own_bedroom_2_repeat_video
    space_id: own_bedroom_2
    tier: video
    input: data/own/bedroom_2_repeat
    ground_truth: benchmarks/ground_truth/own_bedroom_2_repeat_video.yaml
    device: "Nokia 8.1, Android"
    repeat_kind: same_device_repeat
    repeat_of: own_bedroom_2_video
    multi_room: false
  - capture_id: own_kitchen_video
    space_id: own_kitchen
    tier: video
    input: data/own/kitchen
    ground_truth: benchmarks/ground_truth/own_kitchen_video.yaml
    device: "Nokia 8.1, Android"
    repeat_of: null
    multi_room: false
  - capture_id: own_home_video
