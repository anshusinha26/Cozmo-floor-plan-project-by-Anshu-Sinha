# Hand-measured ground truth. Tape readings in centimetres, taken to the
# nearest inch, so truth_uncertainty_m is 2.54 cm / 2 = 0.013 m and the
# coverage check widens the truth by that much before asking whether a
# predicted interval covers it.
#
# Walls are listed clockwise starting from wall A, the wall holding the door.
capture_id: own_home_photo
space_id: own_home
tier: photo
device: "Redmi Note 13, Android"
measured_with: "tape, cm to the nearest inch"
measured_on: 2026-09-20
truth_uncertainty_m: 0.013
rooms:
  # The hall is an irregular open-plan connector: it includes the corridor and
  # the laundry, joined by wide gaps with no doors. There is no tape-measurable
  # wall run, so score_walls is false and it is scored on ceiling height,
  # openings and adjacency only. The staircase room and the portico were not
  # captured, so they are not rooms here; only the doors to them are.
  - id: hall
    label: Hall, corridor and laundry
    ceiling_height_m: 2.9718
    score_walls: false
    walls: []
    notes: open-plan connector, no wall run measured
    openings:
      - {id: door_staircase, type: door, wall_id: A, offset_along_wall_m: 0.0, width_m: 0.9144, height_m: 1.9812}
      - {id: door_portico, type: door, wall_id: B, offset_along_wall_m: 0.0, width_m: 1.1684, height_m: 1.9812}
      - {id: door_bedroom_2, type: door, wall_id: F, offset_along_wall_m: 0.0, width_m: 0.9144, height_m: 1.9812}
  - id: bedroom_1
    ceiling_height_m: 2.9718
    walls:
      - {id: A, length_m: 3.6576}
      - {id: B, length_m: 3.9116}
      - {id: C, length_m: 3.6576}
      - {id: D, length_m: 3.9116}
    openings:
      # tape gives 274.32 cm from the right corner; offset here is from wall A's start
      - {id: door_hall, type: door, wall_id: A, offset_along_wall_m: 0.0, width_m: 0.9144, height_m: 1.9812}
      # Window present on wall C, not measured: a prediction here is neither a hit nor a phantom.
      - {id: window_c, type: window, wall_id: C, present_unmeasured: true}
      # Window present on wall D, not measured: a prediction here is neither a hit nor a phantom.
      - {id: window_d, type: window, wall_id: D, present_unmeasured: true}
  - id: bedroom_2
    ceiling_height_m: 2.9718
    walls:
      - {id: A, length_m: 3.8862}
      - {id: B, length_m: 3.6322}
      - {id: C, length_m: 3.8862}
      - {id: D, length_m: 3.6322}
    openings:
      # tape gives 297.18 cm from the left corner, which is wall A's start
      - {id: door_hall, type: door, wall_id: A, offset_along_wall_m: 2.9718, width_m: 0.9144, height_m: 1.9812}
      # Window present on wall B, not measured: a prediction here is neither a hit nor a phantom.
      - {id: window_b, type: window, wall_id: B, present_unmeasured: true}
      # Window present on wall C, not measured: a prediction here is neither a hit nor a phantom.
      - {id: window_c, type: window, wall_id: C, present_unmeasured: true}
  - id: kitchen
    ceiling_height_m: 2.9718
    walls:
      - {id: A, length_m: 2.6924}
      - {id: B, length_m: 3.6028}
      - {id: C, length_m: 2.6924}
      - {id: D, length_m: 3.6028}
    openings:
      # tape gives 187.12 cm from the left corner, which is wall A's start
      - {id: door_hall, type: door, wall_id: A, offset_along_wall_m: 1.8712, width_m: 0.8128, height_m: 1.9812}
adjacency:
  - {room_a: hall, room_b: bedroom_1}
  - {room_a: hall, room_b: bedroom_2}
  - {room_a: hall, room_b: kitchen}
