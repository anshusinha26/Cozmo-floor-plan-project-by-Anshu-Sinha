# Hand-measured ground truth. Tape readings in centimetres, taken to the
# nearest inch, so truth_uncertainty_m is 2.54 cm / 2 = 0.013 m and the
# coverage check widens the truth by that much before asking whether a
# predicted interval covers it.
#
# Walls are listed clockwise starting from wall A, the wall holding the door.
# Device is the operator's record. EXIF make and model were stripped from
# these files, so it cannot be read back from the images.
capture_id: own_kitchen_video
space_id: own_kitchen
tier: video
device: "Nokia 8.1, Android"
measured_with: "tape, cm to the nearest inch"
measured_on: 2026-09-20
truth_uncertainty_m: 0.013
rooms:
  - id: kitchen
    ceiling_height_m: 2.9718
    walls:
      - {id: A, length_m: 2.6924}
      - {id: B, length_m: 3.6028}
      - {id: C, length_m: 2.6924}
      - {id: D, length_m: 3.6028}
    openings:
      # tape gives 187.12 cm from the left corner, which is wall A's start
      - {id: door_hall, type: door, wall_id: A, offset_along_wall_m: 1.8712, width_m: 0.8128, height_m: 1.9812}
