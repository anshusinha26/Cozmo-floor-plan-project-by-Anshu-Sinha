# Evaluation gate thresholds and matching tolerances.
#
# Loaded by `cozmo eval` and `cozmo bench`; also passed to `cozmo run` so its
# resolved content is hashed into run_manifest.json (config_sha256).
# Units are metres unless the key says otherwise. Fractions are 0..1.

config_version: 1

gates:
  # |pred - truth| <= tolerance_m on at least min_pass_fraction of openings.
  # Denominator is matched + missed + phantom; a missed or phantom opening
  # counts as a failure, never dropped.
  opening_width:
    tolerance_m: 0.02
    min_pass_fraction: 0.85

  # Per-room absolute error, plus spread (max - min) across captures of the
  # same space_id when it appears more than once.
  ceiling_height:
    tolerance_m: 0.015
    spread_tolerance_m: 0.01

  # Labels: ok | repeatable_but_biased | unrepeatable.
  # spread >  small_spread_m                          -> unrepeatable
  # spread <= small_spread_m and |mean err| > biased_mean_m -> repeatable_but_biased
  ceiling_height_diagnosis:
    small_spread_m: 0.01
    biased_mean_m: 0.015

  # Two captures of one space_id at one tier agree per wall within
  # max(abs_tolerance_m, rel_tolerance * length).
  repeatability:
    abs_tolerance_m: 0.01
    rel_tolerance: 0.005

  # Wall length error budget per input tier.
  wall_length_tier:
    photo:
      rel_tolerance: 0.08
    video:
      rel_tolerance: 0.03
    lidar:
      # PROVISIONAL: to be confirmed once the LiDAR path is validated on
      # public ARKitScenes data. Passes if within max(abs, rel * length).
      abs_tolerance_m: 0.02
      rel_tolerance: 0.01
      status: PROVISIONAL

  footprint:
    rel_tolerance: 0.08

  # Predicted adjacency graph must equal ground truth; no tunable threshold.
  stitch_adjacency: {}

  # Total pairwise intersection area of placed room polygons.
  stitch_overlap:
    max_overlap_m2: 0.05

# Entity matching. Rooms match by id, walls by cyclic order (no threshold),
# openings by nearest centre along the matched wall within this gate.
matching:
  opening_offset_gate_m: 0.5

calibration:
  alpha: 0.05

# LiDAR-tier reconstruction parameters. Hashed into run_manifest.json with
# the rest of the resolved config, so a plan can always be traced to them.
pipeline:
  lidar:
    frame_stride: 10            # every Nth depth frame
    voxel_m: 0.02
    min_depth_m: 0.2            # below this the sensor is unreliable
    max_depth_m: 4.5            # beyond this iPhone LiDAR noise grows fast
    vertical_normal_cos: 0.9    # |ny| above this counts as a floor/ceiling normal
    horizontal_normal_cos: 0.25 # |ny| below this counts as a wall normal
    level:
      hist_bin_m: 0.01
      peak_min_fraction: 0.15   # a level peak must hold this share of the tallest peak
      plane_band_m: 0.05        # robust plane fit uses points within this of the peak
      cell_m: 0.25              # grid cell for per-cell height spread
      min_ceiling_coverage: 0.15  # below this, report a prior instead of a measurement
      prior_height_m: [2.2, 3.2]  # used when the ceiling was not observed
    wall:
      min_height_above_floor_m: 0.3
      max_height_below_ceiling_m: 0.1
      hist_bin_m: 0.02
      peak_min_points: 150      # a wall face must have at least this many points
      peak_min_separation_m: 0.06
      occupancy_bin_m: 0.05
      min_run_m: 0.4            # shorter runs are clutter, not wall
      wall_min_top_m: 1.6       # a face whose points stop below this is furniture, not wall
      max_gap_m: 0.35           # runs closer than this join into one face extent
    room:
      grid_m: 0.02
      erode_m: 0.5              # closes doorways so rooms separate
      min_area_m2: 1.5          # smaller components merge or become connectors
      min_constriction_m: 0.62  # half-width: regions joined by a passage wider than 1.24 m are one room
      wall_min_top_m: 1.6       # mirrors wall.wall_min_top_m; only structural faces block rooms
      snap_m: 0.15              # polygon edges snap to wall faces within this
    opening:
      band_low_m: 0.3
      band_high_m: 1.9
      min_width_m: 0.6
      max_width_m: 2.4
      bin_m: 0.05
    drift:
      chunk_s: 5.0
      max_yaw_deg: 5.0          # a chunk correction larger than this is rejected as a bad estimate
      max_shift_m: 0.25
    uncertainty:
      depth_scale_bias: 0.01    # 1% systematic depth scale error
      abs_floor_m: 0.01         # 1 cm floor, no measurement is claimed tighter
      ci_level: 0.95

  # Photo-tier reconstruction parameters. One folder per room, 2 or more stills.
  # Geometry from MapAnything, scale from the camera-height prior, shape from the
  # single-room fitter. Everything below mirrors the video tier's meaning.
  photo:
    device: null
    use_exif_focal: true       # hand MapAnything the focal from EXIF instead of letting it
                               # guess. It guessed 39% long on the camera originals, which
                               # stretched every room sideways by the same factor.
    voxel_m: 0.03
    pixel_stride: 2
    vertical_normal_cos: 0.9
    horizontal_normal_cos: 0.25
    height_prior:
      camera_height_m: 1.40
      camera_height_sigma_m: 0.12
    gravity:
      voxel_m: 0.05
      max_tilt_deg: 30.0
      band_m: 0.08
    openings:
      enabled: true
      detector: owlv2          # OWLv2 "door" detections projected onto the nearest wall
      min_score: 0.20
      max_photos: 8
    level:
      hist_bin_m: 0.03
      peak_min_fraction: 0.10
      plane_band_m: 0.08
      cell_m: 0.30
      min_ceiling_coverage: 0.10
      prior_height_m: [2.2, 3.2]
    wall:
      min_height_above_floor_m: 0.3
      max_height_below_ceiling_m: 0.1
      hist_bin_m: 0.06          # looser again than the video tier: fewer views, more spread
      peak_min_points: 120
      peak_min_separation_m: 0.14
      occupancy_bin_m: 0.06
      min_run_m: 0.4
      wall_min_top_m: 1.4
      max_gap_m: 0.60
    ghost:
      enabled: true
      cell_m: 0.05
      reach_m: 0.40
      probe_offset_m: 0.25
      min_supported_share: 0.20
    room:
      grid_m: 0.04
      erode_m: 0.4
      min_area_m2: 1.0
      min_constriction_m: 0.62
      wall_min_top_m: 1.4
      wall_min_top_fraction: 0.70
      wall_min_top_floor_m: 0.9
      snap_m: 0.30
      unsupported_margin_m: 0.45
      density_bin_m: 0.07        # fix loop 3: a side with no qualifying wall face falls back
      density_min_points: 120     # to the outermost significant peak in the point density
      density_min_share: 0.35     # along that axis, which is what a wall behind a curtain or
      density_max_reach_m: 2.5    # a wardrobe looks like
      density_inward_m: 1.0       # and starts this far inside the camera path, which
                                  # is not a reliable inner bound: see fix loop 3
      allow_l_shape: true
    opening:
      band_low_m: 0.3
      band_high_m: 1.9
      min_width_m: 0.6
      max_width_m: 2.4
      bin_m: 0.05
    uncertainty:
      # PROVISIONAL. The gate at this tier is 8%; the camera-height prior alone is
      # 0.12 on 1.40, which is 8.6%, so this tier cannot claim to pass it on the
      # prior's strength. See docs/photo_tier.md.
      systematic_scale_bias: 0.05
      depth_scale_bias: 0.05
      abs_floor_m: 0.05
      min_coverage: 0.60
      low_coverage_factor: 1.6
      ci_level: 0.95
      status: PROVISIONAL

  # Video-tier reconstruction parameters. One video file in, nothing else.
  # Wall parameters are deliberately looser than the LiDAR tier's: spike 2 fitted
  # a line to one clean wall and measured 4.35 cm RMS against 0.96 cm for the
  # same wall from LiDAR, and a histogram binned for a 1 cm wall cannot find a
  # 4 cm one.
  video:
    device: null                # null picks the first of cuda, mps, cpu
    voxel_m: 0.03
    vertical_normal_cos: 0.9
    horizontal_normal_cos: 0.25
    frames:
      target_fps: 10.0
      long_side: 1280
      max_frames: 600           # fps is lowered until a clip fits this
      drop_blur_fraction: 0.20
      rotation: auto            # ffmpeg applies the container tag; --video-rotation overrides
    engine: sfm               # frames or sfm. Iteration 2 measured the frames engine and
                              # rejected it: see fix_loop/loop2_video_scale/after_iter2/
    frames_engine:
      n_frames: 16            # sharp frames spread across the clip
      max_frames: 24
      min_gap_fraction: 0.4   # a window's pick may not sit next to the previous one's
    sfm:
      overlap: 10
      max_image_size: 1600
      min_chunk_images: 15      # every sub-model this size or larger is kept, not just the largest
      deterministic: true       # pin every seed and thread count pycolmap exposes
      reuse_reconstruction: true  # reuse an existing reconstruction of the same frames.
                                # pycolmap 4.2 is not bit-reproducible even fully pinned, so
                                # the cache is what actually makes a run regenerable
    scale:
      max_frames: 12            # Depth Pro frames per chunk, chosen by SfM conditioning
    height_prior:
      # Fix loop 2. The capture protocol says where the phone is held, which makes
      # the camera height the one quantity in this tier with a known answer. Each
      # chunk is scaled so its own median camera sits this far above its own floor.
      camera_height_m: 1.40     # chest height, overridden per run with --camera-height
      camera_height_sigma_m: 0.12
    bridge:
      overlap_frames: 4
      overlap_window_s: 2.0     # the 4 frames are spread over this many seconds, so the
                                # similarity fit has a baseline to pin a scale with
      min_span_m: 0.20          # below this camera span the fit cannot pin a scale at all
      max_rms_m: 0.12           # alignment residual allowed on each side of a bridge
      max_rms_frac: 0.25        # or this share of the overlap's camera span, whichever is larger
      max_scale_disagreement: 0.15   # floor for the scale agreement gate
      scale_sem_sigmas: 2.0     # the gate widens to this many sigma of the two chunks'
                                # own measured scale errors when those exceed the floor
      max_tilt_deg: 12.0        # levelled mode: how far two chunks may disagree about down
      max_vertical_m: 0.35      # levelled mode: how far a bridge may lift one chunk off the floor
      time_box_s: 5400.0
    dense:
      max_keyframes: 140        # fix loop 2 fits every chunk, not just the bridged group,
                                # because each one needs its own floor plane
      pixel_stride: 2
      min_depth_m: 0.25
      max_depth_m: 8.0
      scale_tolerance: 0.08     # cross-frame consistency: how far one frame's fitted scale
                                # may sit from the chunk median before it is pulled back
    gravity:
      voxel_m: 0.05
      max_tilt_deg: 30.0        # a plane further than this from the camera seed is not the floor
      band_m: 0.08
    drift:
      voxel_m: 0.06
      max_yaw_deg: 6.0          # a larger chunk yaw snap is rejected as a bad estimate
    level:
      hist_bin_m: 0.02
      peak_min_fraction: 0.15
      plane_band_m: 0.06
      cell_m: 0.25
      min_ceiling_coverage: 0.12
      prior_height_m: [2.2, 3.2]
    wall:
      min_height_above_floor_m: 0.3
      max_height_below_ceiling_m: 0.1
      hist_bin_m: 0.04          # LiDAR uses 0.02; this tier's faces are about 4 cm thick
      peak_min_points: 150
      peak_min_separation_m: 0.10
      occupancy_bin_m: 0.05
      min_run_m: 0.4
      wall_min_top_m: 1.5
      max_gap_m: 0.45
    ghost:
      enabled: true
      cell_m: 0.05
      reach_m: 0.35
      probe_offset_m: 0.25
      min_supported_share: 0.25
    room:
      grid_m: 0.03
      erode_m: 0.4              # LiDAR uses 0.5; this tier's free space is thinner because
                                # only part of the floor is ever reconstructed
      min_area_m2: 1.0
      min_constriction_m: 0.62
      wall_min_top_m: 1.5       # a ceiling on the bar, not the bar itself: see below
      wall_min_top_fraction: 0.75  # a wall reaches this share of the height actually
                                   # reconstructed, because this tier never sees a whole wall
      wall_min_top_floor_m: 0.9    # but never low enough for a table or a bed back
      snap_m: 0.22              # LiDAR uses 0.15; matches the wider face tolerance
      unsupported_margin_m: 0.35
      density_bin_m: 0.06        # fix loop 3: a side with no qualifying wall face falls back
      density_min_points: 120     # to the outermost significant peak in the point density
      density_min_share: 0.35     # along that axis, which is what a wall behind a curtain or
      density_max_reach_m: 2.5    # a wardrobe looks like
      density_inward_m: 1.0       # and starts this far inside the camera path, which
                                  # is not a reliable inner bound: see fix loop 3  # single-room mode: how far past the camera path a side with
                                  # no wall face is closed by the rectangle assumption
      allow_l_shape: true
    opening:
      band_low_m: 0.3
      band_high_m: 1.9
      min_width_m: 0.6
      max_width_m: 2.4
      bin_m: 0.05
    uncertainty:
      # PROVISIONAL: 3% systematic until this tier is calibrated on tape data.
      # Spike 2 measured 1.1% and 1.3% scale error on two scans; two scans of one
      # device do not earn a tighter claim. See docs/video_tier.md.
      systematic_scale_bias: 0.03
      depth_scale_bias: 0.03    # replaced at run time by the combined budget
      abs_floor_m: 0.03         # 3 cm floor; the LiDAR tier claims 1 cm
      min_coverage: 0.60        # below this share of the video, intervals widen and the plan warns
      low_coverage_factor: 1.6
      ci_level: 0.95
      status: PROVISIONAL
