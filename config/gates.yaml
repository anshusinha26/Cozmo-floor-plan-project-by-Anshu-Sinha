# Evaluation gate thresholds and matching tolerances.
#
# Loaded by `cozmo eval` and `cozmo bench`; also passed to `cozmo run` so its
# resolved content is hashed into run_manifest.json (config_sha256).
# Units are metres unless the key says otherwise. Fractions are 0..1.

config_version: 1

gates:
  # |pred - truth| <= tolerance_m on at least min_pass_fraction of openings.
  # Denominator is matched + missed + phantom; a missed or phantom opening
  # counts as a failure, never dropped.
  opening_width:
    tolerance_m: 0.02
    min_pass_fraction: 0.85

  # Per-room absolute error, plus spread (max - min) across captures of the
  # same space_id when it appears more than once.
  ceiling_height:
    tolerance_m: 0.015
    spread_tolerance_m: 0.01

  # Labels: ok | repeatable_but_biased | unrepeatable.
  # spread >  small_spread_m                          -> unrepeatable
  # spread <= small_spread_m and |mean err| > biased_mean_m -> repeatable_but_biased
  ceiling_height_diagnosis:
    small_spread_m: 0.01
    biased_mean_m: 0.015

  # Two captures of one space_id at one tier agree per wall within
  # max(abs_tolerance_m, rel_tolerance * length).
  repeatability:
    abs_tolerance_m: 0.01
    rel_tolerance: 0.005

  # Wall length error budget per input tier.
  wall_length_tier:
    photo:
      rel_tolerance: 0.08
    video:
      rel_tolerance: 0.03
    lidar:
      # PROVISIONAL: to be confirmed once the LiDAR path is validated on
      # public ARKitScenes data. Passes if within max(abs, rel * length).
      abs_tolerance_m: 0.02
      rel_tolerance: 0.01
      status: PROVISIONAL

  footprint:
    rel_tolerance: 0.08

  # Predicted adjacency graph must equal ground truth; no tunable threshold.
  stitch_adjacency: {}

  # Total pairwise intersection area of placed room polygons.
  stitch_overlap:
    max_overlap_m2: 0.05

# Entity matching. Rooms match by id, walls by cyclic order (no threshold),
# openings by nearest centre along the matched wall within this gate.
matching:
  opening_offset_gate_m: 0.5

calibration:
  alpha: 0.05

# LiDAR-tier reconstruction parameters. Hashed into run_manifest.json with
# the rest of the resolved config, so a plan can always be traced to them.
pipeline:
  lidar:
    frame_stride: 10            # every Nth depth frame
    voxel_m: 0.02
    min_depth_m: 0.2            # below this the sensor is unreliable
    max_depth_m: 4.5            # beyond this iPhone LiDAR noise grows fast
    vertical_normal_cos: 0.9    # |ny| above this counts as a floor/ceiling normal
    horizontal_normal_cos: 0.25 # |ny| below this counts as a wall normal
    level:
      hist_bin_m: 0.01
      peak_min_fraction: 0.15   # a level peak must hold this share of the tallest peak
      plane_band_m: 0.05        # robust plane fit uses points within this of the peak
      cell_m: 0.25              # grid cell for per-cell height spread
      min_ceiling_coverage: 0.15  # below this, report a prior instead of a measurement
      prior_height_m: [2.2, 3.2]  # used when the ceiling was not observed
    wall:
      min_height_above_floor_m: 0.3
      max_height_below_ceiling_m: 0.1
      hist_bin_m: 0.02
      peak_min_points: 150      # a wall face must have at least this many points
      peak_min_separation_m: 0.06
      occupancy_bin_m: 0.05
      min_run_m: 0.4            # shorter runs are clutter, not wall
      wall_min_top_m: 1.6       # a face whose points stop below this is furniture, not wall
      max_gap_m: 0.35           # runs closer than this join into one face extent
    ghost:
      # A real wall has observed floor on at least one side, because somebody
      # stood there. Glass and mirror returns outside the property do not.
      enabled: true
      cell_m: 0.05
      reach_m: 0.35
      probe_offset_m: 0.25
      min_supported_share: 0.25

    room:
      grid_m: 0.02
      erode_m: 0.5              # closes doorways so rooms separate
      min_area_m2: 1.5          # smaller components merge or become connectors
      min_constriction_m: 0.62  # half-width: regions joined by a passage wider than 1.24 m are one room
      wall_min_top_m: 1.6       # mirrors wall.wall_min_top_m; only structural faces block rooms
      snap_m: 0.15              # polygon edges snap to wall faces within this
    opening:
      band_low_m: 0.3
      band_high_m: 1.9
      min_width_m: 0.6
      max_width_m: 2.4
      bin_m: 0.05
    drift:
      chunk_s: 5.0
      max_yaw_deg: 5.0          # a chunk correction larger than this is rejected as a bad estimate
      max_shift_m: 0.25
    uncertainty:
      depth_scale_bias: 0.01    # 1% systematic depth scale error
      abs_floor_m: 0.01         # 1 cm floor, no measurement is claimed tighter
      ci_level: 0.95
